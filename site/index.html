<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="面向 Agent 应用与基础设施岗位的研究生三年科研、实习与求职决策工作台。">

  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- 主题在首帧绘制前定格：浅色是默认，只有明确存过 dark 才切深色（localStorage 异常时保持浅色） -->
  <script>try { if (localStorage.getItem('rp.theme') === 'dark') document.body.className += ' dark'; } catch (e) { }</script>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <h1>研究生三年发展路径</h1>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-sep">每天打开</div>
        <a class="nav-item" href="#dashboard" data-route="dashboard"><span>当前安排</span></a>
        <a class="nav-item" href="#reading" data-route="reading"><span>本周学习</span></a>
        <a class="nav-item" href="#verify" data-route="verify"><span>待核验事项</span></a>
        <div class="nav-sep">研究与实践</div>
        <a class="nav-item" href="#research" data-route="research"><span>研究主线</span></a>
        <a class="nav-item" href="#skills" data-route="skills"><span>技能学习</span></a>
        <a class="nav-item" href="#portfolio" data-route="portfolio"><span>作品集</span></a>
        <div class="nav-sep">长期规划与参考</div>
        <a class="nav-item" href="#jobs" data-route="jobs"><span>实习与岗位</span></a>
        <a class="nav-item" href="#career" data-route="career"><span>求职准备</span></a>
        <a class="nav-item" href="#baseline" data-route="baseline"><span>读研前提</span></a>
        <a class="nav-item" href="#tools" data-route="tools"><span>工具与方法</span></a>
      </nav>
      <div class="sidebar-foot">
        <!-- 证据分级图例：这份文档的核心纪律是「不把推断当事实」，
             把色码常驻在视野里，读者不必去猜绿/黄/红代表什么。 -->
        <div class="legend" aria-label="证据可靠度图例">
          <span><i style="background:var(--high)"></i>一手</span>
          <span><i style="background:var(--mid)"></i>二手</span>
          <span><i style="background:var(--low)"></i>推断</span>
        </div>
        <button class="toggle-theme" id="theme-toggle" type="button" aria-label="切换深浅主题">◐ <span>切换主题</span></button>
        <details class="acc" id="settings-panel">
          <summary>本机设置</summary>
          <div class="acc-body">
            <p class="mono-sm" style="margin:0 0 8px">勾选进度只存在这台电脑的浏览器里。</p>
            <button class="btn sm" id="reset-progress" type="button">清空全部进度</button>
          </div>
        </details>
        <div class="mono-sm">数据修订至 2026-09-06</div>
      </div>
    </aside>
    <button class="nav-overlay" id="nav-overlay" type="button" aria-label="关闭导航" tabindex="-1"></button>

    <main class="main" id="content" tabindex="-1">
      <header class="topbar">
        <button class="btn sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false">☰ <span class="sr-only">打开导航</span></button>
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m21 20-4.6-4.6a7.5 7.5 0 1 0-1 1L20 21zM5.5 11a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0"/></svg>
          <label class="sr-only" for="search">搜索本站内容</label>
          <input id="search" type="search" autocomplete="off" placeholder="搜索页面里的内容：论文、岗位、技能、计划">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-spacer"></div>
        <span class="session-note" id="phase-chip" hidden></span>
      </header>
      <div id="app" aria-live="polite"></div>
      <footer class="site-footer">
        数据修订至 2026-09-06（主线：任务完成验证）；招聘快照抓取于 2026-07-28。未来招聘批次为历史规律外推，请以企业官方公告为准；事实、推断与待核验项已分级展示。
      </footer>
    </main>
  </div>

  <noscript><div class="noscript">此网站需要 JavaScript 渲染本地数据。</div></noscript>
  <script src="data/facts.js" defer></script>
  <script src="data/research.js" defer></script>
  <script src="data/tools.js" defer></script>
  <script src="data/jobs.js" defer></script>
  <script src="data/skills.js" defer></script>
  <script src="data/portfolio.js" defer></script>
  <script src="data/papers.js" defer></script>
  <script src="assets/l3.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
